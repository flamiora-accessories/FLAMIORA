<script>
  // The WhatsApp message is opened only when the customer taps this real link
  // herself — never auto-triggered by script. This is the most reliable method
  // across mobile Safari/Chrome, desktop, and restrictive in-app browsers
  // (Instagram/Facebook), which routinely block programmatic popups/redirects
  // but always allow a genuine user click on a normal hyperlink.
  (function () {
    var url = sessionStorage.getItem('flm_last_wa_url');
    var btn = document.getElementById('confirm-wa-btn');
    if (url && btn) {
      btn.href = url;
    } else if (btn) {
      btn.style.display = 'none';
    }
  })();
</script>

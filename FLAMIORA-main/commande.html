<script>
  function populateCities() {
    const select = document.getElementById('city');
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = t('checkout.selectCity');
    select.innerHTML = '';
    select.appendChild(placeholder);
    window.CITIES.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = localized(c, 'name');
      select.appendChild(opt);
    });
  }

  function updateSummary() {
    const subtotal = cartSubtotal();
    const cityId = document.getElementById('city').value;
    const city = getCityById(cityId);
    const shipping = city ? city.price : 0;
    document.getElementById('summary-subtotal').textContent = formatPrice(subtotal);
    document.getElementById('summary-shipping').textContent = city ? formatPrice(shipping) : t('cart.shippingNote');
    document.getElementById('summary-total').textContent = formatPrice(subtotal + shipping);
  }

  function validateMoroccanPhone(value) {
    const digits = value.replace(/[\s.-]/g, '');
    return /^(0|\+212|00212)[5-7]\d{8}$/.test(digits);
  }

  async function saveOrderToFirestore({ name, phone, cityId, address, notes }) {
    const city = getCityById(cityId);
    const lines = getCart();
    const shipping = city ? city.price : 0;
    const subtotal = cartSubtotal();
    const items = lines
      .map((l) => {
        const p = getCartItem(l);
        if (!p) return null;
        return { product_id: p.id, type: lineType(l), name_ar: p.name_ar, name_fr: p.name_fr, price: p.price, qty: l.qty };
      })
      .filter(Boolean);
    try {
      const docRef = await db.collection('orders').add({
        customer_name: name,
        customer_phone: phone,
        city_id: cityId,
        city_name: city ? city.name_fr : '',
        address,
        notes: notes || '',
        items,
        subtotal,
        shipping_fee: shipping,
        total: subtotal + shipping,
        status: 'pending',
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      return { success: true, id: docRef.id };
    } catch (e) {
      // La commande reste envoyée via WhatsApp même si l'enregistrement Firestore échoue
      // (ex. hors ligne) — WhatsApp est le canal de confirmation garanti pour la cliente.
      console.error('[FLAMIORA] FIRESTORE_ORDER_ERROR', { code: e && e.code, message: e && e.message });
      return { success: false, error: { code: e && e.code, message: e && e.message } };
    }
  }

  let checkoutFormWired = false;
  let isSubmittingOrder = false;

  function renderCheckoutPage() {
    const lines = getCart();
    if (lines.length === 0) {
      document.getElementById('checkout-empty').hidden = false;
      document.getElementById('checkout-layout').hidden = true;
      return;
    }
    document.getElementById('checkout-empty').hidden = true;
    document.getElementById('checkout-layout').hidden = false;
    populateCities();
    updateSummary();
  }

  function wireCheckoutForm() {
    if (checkoutFormWired) return;
    checkoutFormWired = true;

    document.getElementById('city').addEventListener('change', updateSummary);

    const submitBtn = document.getElementById('submit-btn');

    // Un seul tap = navigation réelle vers WhatsApp (pas de redirection JS,
    // pas de page merci.html). C'est un vrai <a href> cliqué directement par
    // la cliente : ça reste fiable même sur Safari iOS et les navigateurs
    // intégrés (Instagram/Facebook), qui bloquent souvent les redirections
    // déclenchées par script mais laissent toujours passer un vrai clic sur
    // un lien classique.
    submitBtn.addEventListener('click', (e) => {
      if (isSubmittingOrder) {
        e.preventDefault();
        return;
      }

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const cityId = document.getElementById('city').value;
      const address = document.getElementById('address').value.trim();
      const notes = document.getElementById('notes').value.trim();

      let valid = true;
      const setError = (fieldId, errId, show, message) => {
        document.getElementById(fieldId).classList.toggle('invalid', show);
        const errEl = document.getElementById(errId);
        if (message) errEl.textContent = message;
        errEl.hidden = !show;
        if (show) valid = false;
      };

      setError('name', 'err-name', name.length === 0);
      setError('phone', 'err-phone', phone.length === 0, t('checkout.required'));
      if (phone.length > 0 && !validateMoroccanPhone(phone)) {
        setError('phone', 'err-phone', true, t('checkout.invalidPhone'));
      }
      setError('city', 'err-city', cityId === '');
      setError('address', 'err-address', address.length === 0);

      if (!valid) {
        e.preventDefault();
        return;
      }

      console.log('[FLAMIORA] ORDER_SUBMIT_STARTED');

      let url;
      try {
        const message = buildOrderMessage({ name, phone, cityId, address, notes });
        url = buildWhatsAppUrl(message);
        console.log('[FLAMIORA] WHATSAPP_URL', { length: url.length });
      } catch (err) {
        console.error('[FLAMIORA] ORDER_MESSAGE_BUILD_ERROR', { message: err && err.message });
        e.preventDefault();
        return;
      }

      isSubmittingOrder = true;

      // On met à jour le href juste avant que le navigateur suive le lien
      // (toujours dans le même clic, donc toujours un vrai tap) — on ne
      // fait PAS e.preventDefault() ici : le navigateur ouvre WhatsApp
      // (nouvel onglet) tout seul, sans passer par du JS.
      submitBtn.href = url;

      // Sauvegarde Firestore + nettoyage panier en arrière-plan, sans
      // bloquer ni retarder la navigation vers WhatsApp qui vient de partir.
      saveOrderToFirestore({ name, phone, cityId, address, notes })
        .then((result) => {
          if (result.success) {
            console.log('[FLAMIORA] FIRESTORE_ORDER_SUCCESS', { id: result.id });
          } else {
            console.error('[FLAMIORA] FIRESTORE_ORDER_ERROR', result.error);
          }
        })
        .catch((err) => {
          console.error('[FLAMIORA] ORDER_SUBMIT_UNEXPECTED_ERROR', { message: err && err.message });
        });

      localStorage.removeItem('flm_cart');
      updateCartBadge();

      document.getElementById('checkout-summary-box').hidden = true;
      document.getElementById('checkout-form').hidden = true;
      document.getElementById('checkout-sent').hidden = false;
    });
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    renderCheckoutPage();
    wireCheckoutForm();
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(renderCheckoutPage, 0));
    });
  });
</script>

<script>
  function renderCartLine(line) {
    const isEnsemble = lineType(line) === 'ensemble';
    const item = getCartItem(line);
    if (!item) return '';
    const name = localized(item, 'name');
    const href = isEnsemble ? `ensemble.html?slug=${item.slug}` : `produit.html?slug=${item.slug}`;
    const maxQty = isEnsemble ? 99 : item.stock;
    return `<div class="cart-line" data-line="${item.id}">
      <a class="thumb" href="${href}" aria-label="${name}">
        <span class="product-placeholder" aria-hidden="true"><i class="fa-solid ${isEnsemble ? 'fa-gifts' : 'fa-gem'}"></i></span>
      </a>
      <div class="info">
        <a class="name" href="${href}">${name}${isEnsemble ? ` <small style="opacity:.6">(${t('ensemble.badge')})</small>` : ''}</a>
        <span class="unit-price">${formatPrice(item.price)}</span>
        <div class="line-actions">
          <div class="qty-stepper">
            <button type="button" data-minus="${item.id}" data-type="${isEnsemble ? 'ensemble' : 'product'}" aria-label="-">−</button>
            <input type="number" min="1" max="${maxQty}" value="${line.qty}" data-qty="${item.id}" data-type="${isEnsemble ? 'ensemble' : 'product'}">
            <button type="button" data-plus="${item.id}" data-type="${isEnsemble ? 'ensemble' : 'product'}" aria-label="+">+</button>
          </div>
          <button type="button" class="remove-btn" data-remove="${item.id}" data-type="${isEnsemble ? 'ensemble' : 'product'}">${t('cart.remove')}</button>
        </div>
      </div>
      <div class="line-total">${formatPrice(item.price * line.qty)}</div>
    </div>`;
  }

  function populateQuickCities() {
    const select = document.getElementById('quick-city');
    if (!select || !window.CITIES) return;
    select.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = t('checkout.selectCity');
    select.appendChild(placeholder);
    window.CITIES.forEach((c) => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = localized(c, 'name');
      select.appendChild(opt);
    });
  }

  function renderQuickCheckoutSummary() {
    const box = document.getElementById('quick-checkout-summary');
    if (!box) return;
    const lines = getCart();
    const subtotal = cartSubtotal();
    const cityId = document.getElementById('quick-city')?.value || '';
    const city = getCityById(cityId);
    const shipping = city ? city.price : 0;
    const itemText = lines.map((line) => {
      const p = getCartItem(line);
      return `<div class="quick-summary-item"><span>${localized(p, 'name')} <b>× ${line.qty}</b></span><strong>${formatPrice(p.price * line.qty)}</strong></div>`;
    }).join('');
    box.innerHTML = `${itemText}
      <div class="quick-summary-divider"></div>
      <div class="quick-summary-row"><span>${t('cart.subtotal')}</span><strong>${formatPrice(subtotal)}</strong></div>
      <div class="quick-summary-row"><span>${t('cart.shipping')}</span><strong>${city ? formatPrice(shipping) : t('cart.shippingNote')}</strong></div>
      <div class="quick-summary-row total"><span>${t('cart.total')}</span><strong>${formatPrice(subtotal + shipping)}</strong></div>`;
  }

  function openCheckoutModal() {
    const modal = document.getElementById('checkout-modal');
    if (!modal || getCart().length === 0) return;
    populateQuickCities();
    renderQuickCheckoutSummary();
    modal.classList.add('open');
    trackStoreEvent('checkout_open', { cart_count: cartCount(), value: cartSubtotal() });
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('checkout-modal-open');
    setTimeout(() => document.getElementById('quick-name')?.focus(), 120);
  }

  function closeCheckoutModal() {
    const modal = document.getElementById('checkout-modal');
    if (!modal) return;
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('checkout-modal-open');
  }

  function clearQuickCheckoutErrors() {
    ['name','phone','city','address'].forEach((field) => {
      const input = document.getElementById(`quick-${field}`);
      const error = document.getElementById(`quick-err-${field}`);
      input?.classList.remove('invalid');
      if (error) error.hidden = true;
    });
  }

  function setQuickError(field, message) {
    const input = document.getElementById(`quick-${field}`);
    const error = document.getElementById(`quick-err-${field}`);
    input?.classList.add('invalid');
    if (error) {
      error.textContent = message || t('checkout.required');
      error.hidden = false;
    }
    return false;
  }

  let isSubmittingQuickOrder = false;

  // Un seul tap sur #quick-submit (un vrai <a href>, plus un <button
  // type="submit">) = navigation réelle vers WhatsApp, sans passer par
  // merci.html. Même logique et même raison que sur commande.html : ça
  // reste fiable même sur Safari iOS et les navigateurs intégrés
  // (Instagram/Facebook).
  function submitQuickCheckout(e) {
    const submit = document.getElementById('quick-submit');

    if (isSubmittingQuickOrder) {
      e.preventDefault();
      return;
    }

    clearQuickCheckoutErrors();

    const name = document.getElementById('quick-name').value.trim();
    const phone = document.getElementById('quick-phone').value.trim();
    const cityId = document.getElementById('quick-city').value;
    const address = document.getElementById('quick-address').value.trim();
    const notes = document.getElementById('quick-notes').value.trim();

    let valid = true;

    if (!name) {
      setQuickError('name');
      valid = false;
    }

    if (!phone) {
      setQuickError('phone');
      valid = false;
    } else if (!validateMoroccanPhone(phone)) {
      setQuickError('phone', t('checkout.invalidPhone'));
      valid = false;
    }

    if (!cityId) {
      setQuickError('city');
      valid = false;
    }

    if (!address) {
      setQuickError('address');
      valid = false;
    }

    if (!valid) {
      e.preventDefault();
      return;
    }

    trackStoreEvent('checkout_submit', {
      cart_count: cartCount(),
      value: cartSubtotal()
    });

    console.log('[FLAMIORA] ORDER_SUBMIT_STARTED');

    let url;
    try {
      const message = buildOrderMessage({ name, phone, cityId, address, notes });
      url = buildWhatsAppUrl(message);
    } catch (err) {
      console.error('[FLAMIORA] ORDER_MESSAGE_BUILD_ERROR', { message: err && err.message });
      e.preventDefault();
      return;
    }

    isSubmittingQuickOrder = true;

    // On met à jour le href juste avant que le navigateur suive le lien
    // (toujours dans le même clic) — pas de e.preventDefault() ici : le
    // navigateur ouvre WhatsApp (nouvel onglet) tout seul.
    submit.href = url;

    // Sauvegarde Firestore en arrière-plan, sans bloquer ni retarder la
    // navigation vers WhatsApp qui vient de partir.
    saveQuickOrderToFirestore({ name, phone, cityId, address, notes })
      .then((result) => {
        if (result && result.success) {
          console.log('[FLAMIORA] FIRESTORE_ORDER_SUCCESS', { id: result.id });
        } else {
          console.error('[FLAMIORA] FIRESTORE_ORDER_ERROR', result ? result.error : 'Unknown error');
        }
      })
      .catch((err) => {
        console.error('[FLAMIORA] ORDER_SUBMIT_UNEXPECTED_ERROR', { message: err && err.message });
      });

    localStorage.removeItem(CART_KEY);
    updateCartBadge();
    closeCheckoutModal();
    renderCartPage();

    isSubmittingQuickOrder = false;
  }

  async function saveQuickOrderToFirestore({ name, phone, cityId, address, notes }) {
    const city = getCityById(cityId);
    const lines = getCart();
    const subtotal = cartSubtotal();
    const shipping = city ? city.price : 0;
    const items = lines
      .map((l) => {
        const p = getCartItem(l);
        if (!p) return null;
        return { product_id: p.id, type: lineType(l), name_ar: p.name_ar, name_fr: p.name_fr, price: p.price, qty: l.qty };
      })
      .filter(Boolean);
    try {
      const ref = await db.collection('orders').add({
        customer_name: name,
        customer_phone: phone,
        city_id: cityId,
        city_name: city ? city.name_fr : '',
        address,
        notes: notes || '',
        items,
        subtotal,
        shipping_fee: shipping,
        total: subtotal + shipping,
        status: 'pending',
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
      });
      trackStoreEvent('checkout_success', { order_id: ref.id, cart_count: items.reduce((sum, item) => sum + item.qty, 0), value: subtotal + shipping });
      return { success: true, id: ref.id };
    } catch (e) {
      console.error('[FLAMIORA] FIRESTORE_ORDER_ERROR', { code: e && e.code, message: e && e.message });
      return { success: false, error: { code: e && e.code, message: e && e.message } };
    }
  }

  function renderCartPage() {
    const lines = getCart();
    trackStoreEvent('cart_view', { cart_count: cartCount(), value: cartSubtotal() });
    const empty = document.getElementById('cart-empty');
    const layout = document.getElementById('cart-layout');
    if (lines.length === 0) {
      empty.hidden = false;
      layout.hidden = true;
      closeCheckoutModal();
      return;
    }
    empty.hidden = true;
    layout.hidden = false;
    document.getElementById('cart-lines').innerHTML = lines.map(renderCartLine).join('');
    const subtotal = cartSubtotal();
    document.getElementById('summary-subtotal').textContent = formatPrice(subtotal);
    document.getElementById('summary-total').textContent = formatPrice(subtotal);
    document.querySelectorAll('[data-remove]').forEach((btn) => btn.addEventListener('click', () => { removeFromCart(btn.dataset.remove, btn.dataset.type || 'product'); renderCartPage(); }));
    document.querySelectorAll('[data-minus]').forEach((btn) => btn.addEventListener('click', () => {
      const type = btn.dataset.type || 'product';
      const line = getCart().find((l) => l.id === btn.dataset.minus && lineType(l) === type);
      if (line) { updateCartQty(btn.dataset.minus, Math.max(1, line.qty - 1), type); renderCartPage(); }
    }));
    document.querySelectorAll('[data-plus]').forEach((btn) => btn.addEventListener('click', () => {
      const type = btn.dataset.type || 'product';
      const line = getCart().find((l) => l.id === btn.dataset.plus && lineType(l) === type);
      if (line) { updateCartQty(btn.dataset.plus, line.qty + 1, type); renderCartPage(); }
    }));
    document.querySelectorAll('[data-qty]').forEach((input) => input.addEventListener('change', () => {
      updateCartQty(input.dataset.qty, parseInt(input.value, 10) || 1, input.dataset.type || 'product'); renderCartPage();
    }));
  }

  FLM_DATA_READY.then(() => {
    applyLocale();
    renderCartPage();
    document.querySelectorAll('.lang-switch button').forEach((btn) => btn.addEventListener('click', () => {
      setTimeout(() => { applyLocale(); renderCartPage(); if (document.getElementById('checkout-modal')?.classList.contains('open')) { populateQuickCities(); renderQuickCheckoutSummary(); } }, 0);
    }));
    document.getElementById('open-checkout')?.addEventListener('click', openCheckoutModal);
    document.querySelectorAll('[data-close-checkout]').forEach((el) => el.addEventListener('click', closeCheckoutModal));
    document.getElementById('quick-city')?.addEventListener('change', renderQuickCheckoutSummary);
    document.getElementById('quick-submit')?.addEventListener('click', submitQuickCheckout);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCheckoutModal(); });
  });
</script>

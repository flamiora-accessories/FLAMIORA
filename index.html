<script>
  const CATEGORY_ICONS = {
    earrings: `<svg class="cat-icon-svg" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M38 25 C38 17 44 12 50 12 C56 12 62 17 62 25 C62 32 58 37 53 39 C51 40 49 40 47 39 C42 37 38 32 38 25Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M50 39 L50 57" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M39 57 C39 51 44 47 50 47 C56 47 61 51 61 57 C61 64 56 69 50 69 C44 69 39 64 39 57Z" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="50" cy="57" r="3" fill="currentColor"/>
    </svg>`,
    necklaces: `<svg class="cat-icon-svg" viewBox="0 0 100 100" aria-hidden="true">
      <path d="M25 23 C28 48 37 66 50 72 C63 66 72 48 75 23" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M31 35 C36 52 42 60 50 64 C58 60 64 52 69 35" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".55"/>
      <path d="M50 63 L43 75 L50 86 L57 75 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="50" cy="75" r="2.5" fill="currentColor"/>
    </svg>`,
    rings: `<svg class="cat-icon-svg" viewBox="0 0 100 100" aria-hidden="true">
      <ellipse cx="50" cy="59" rx="25" ry="18" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M38 53 C39 43 43 35 50 35 C57 35 61 43 62 53" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 25 L56 35 L50 43 L44 35 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="50" cy="34" r="2" fill="currentColor"/>
    </svg>`,
    bracelets: `<svg class="cat-icon-svg" viewBox="0 0 100 100" aria-hidden="true">
      <ellipse cx="50" cy="54" rx="30" ry="17" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M20 54 C20 72 33 82 50 82 C67 82 80 72 80 54" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M27 48 C34 57 42 61 50 61 C58 61 66 57 73 48" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
      <circle cx="50" cy="61" r="3" fill="currentColor"/>
    </svg>`,
  };
  const CATEGORY_DECORATION = `<svg class="category-decoration" viewBox="0 0 100 100" aria-hidden="true">
    <path d="M82 16 L84.6 22.2 L91 25 L84.6 27.8 L82 34 L79.4 27.8 L73 25 L79.4 22.2 Z" fill="currentColor" opacity=".85"/>
    <circle cx="19" cy="81" r="2.1" fill="currentColor" opacity=".55"/>
    <circle cx="13" cy="73" r="1.2" fill="currentColor" opacity=".4"/>
  </svg>`;
  function categoryIcon(cat) {
    return CATEGORY_ICONS[cat.id] || CATEGORY_ICONS.rings;
  }

  function renderCategoryCard(cat) {
    const ar = cat.name_ar || '';
    const fr = cat.name_fr || '';
    const catImage = cat.image || cat.image_url || '';
    const visual = catImage
      ? `<img class="category-image" src="${catImage}" alt="${localized(cat, 'name')}" loading="lazy"/>`
      : `<span class="category-circle" aria-hidden="true">${CATEGORY_DECORATION}${categoryIcon(cat)}</span>`;
    return `<a class="category-card" href="produits.html?cat=${cat.id}">
      ${visual}
      <span class="category-name">${localized(cat, 'name')}</span>
      <span class="category-translation">${getLocale() === 'ar' ? fr : ar}</span>
    </a>`;
  }

  function renderProductCard(p) {
    const compareHtml = p.compare_at ? `<span class="old">${formatPrice(p.compare_at)}</span>` : '';
    const disabled = p.stock <= 0 ? 'disabled' : '';
    const newBadge = p.compare_at ? '' : (p.featured ? `<span class="new-badge">${getLocale() === 'ar' ? 'جديد' : 'Nouveau'}</span>` : '');
    return `<div class="product-card">
      ${newBadge}
      <button class="wish-btn" data-wish="${p.id}" aria-label="Wishlist"><i class="fa-regular fa-heart" aria-hidden="true"></i></button>
      <a class="thumb" href="produit.html?slug=${p.slug}" aria-label="${localized(p, 'name')}">
        ${p.image ? `<img src="${p.image}" alt="${localized(p, 'name')}" loading="lazy" decoding="async"/>` : `<span class="product-placeholder" aria-hidden="true"><i class="fa-solid fa-gem"></i></span>`}
      </a>
      <div class="body">
        ${stockBadge(p)}
        <a href="produit.html?slug=${p.slug}" class="name">${localized(p, 'name')}</a>
        <div class="price">${compareHtml}${formatPrice(p.price)}</div>
        <button class="btn btn-primary add-btn" data-add="${p.id}" ${disabled}>${t('product.addToCart')}</button>
      </div>
    </div>`;
  }

  function applyHeroSettings() {
    const settings = window.FLM_SETTINGS || {};
    const img1 = document.getElementById('hero-img-1');
    const img2 = document.getElementById('hero-img-2');
    if (img1 && settings.hero_image_1) img1.src = settings.hero_image_1;
    if (img2 && settings.hero_image_2) img2.src = settings.hero_image_2;
  }

  function wireHeroSlider() {
    const slides = document.querySelectorAll('.hero-slide');
    const dots = document.querySelectorAll('#hero-dots button');
    if (!slides.length || !dots.length) return;
    let current = 0;
    let timer = null;
    function show(i) {
      slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
      dots.forEach((d, idx) => d.classList.toggle('active', idx === i));
      current = i;
    }
    function restart() {
      clearInterval(timer);
      timer = setInterval(() => show((current + 1) % slides.length), 5500);
    }
    dots.forEach((d) => d.addEventListener('click', () => { show(Number(d.dataset.dot)); restart(); }));
    restart();
  }

  function renderEnsembleCard(e) {
    const price = Number(e.price) || 0;
    const compareAt = Number(e.compare_at) || 0;
    const discount = compareAt > price ? Math.round(((compareAt - price) / compareAt) * 100) : 0;
    const compareHtml = compareAt > price ? `<span class="old">${formatPrice(compareAt)}</span>` : '';
    const name = localized(e, 'name');
    const href = `ensemble.html?slug=${e.slug}`;
    return `<div class="product-card ensemble-card">
      ${discount > 0 ? `<span class="discount-badge">-${discount}%</span>` : ''}
      <a class="thumb" href="${href}" aria-label="${name}">
        ${e.image ? `<img src="${e.image}" alt="${name}" loading="lazy" decoding="async"/>` : `<span class="product-placeholder" aria-hidden="true"><i class="fa-solid fa-gem"></i></span>`}
      </a>
      <div class="body">
        ${stockBadge(e)}
        <a href="${href}" class="name">${name}</a>
        <div class="price">${compareHtml}${formatPrice(price)}</div>
        <button class="btn btn-primary add-btn" data-add-ensemble="${e.id}">${t('ensemble.addToCart')}</button>
      </div>
    </div>`;
  }

  function initHome() {
    document.getElementById('category-grid').innerHTML = window.CATEGORIES.map(renderCategoryCard).join('');
    document.getElementById('featured-grid').innerHTML = window.PRODUCTS.filter((p) => p.featured).slice(0, 4).map(renderProductCard).join('');
    const ensembles = (window.ENSEMBLES || []).filter((e) => e.active !== false);
    document.getElementById('ensembles-grid').innerHTML = ensembles.map(renderEnsembleCard).join('');
    document.getElementById('ensembles-section').hidden = ensembles.length === 0;
    document.querySelectorAll('#ensembles-grid [data-add-ensemble]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addToCart(btn.dataset.addEnsemble, 1, 'ensemble');
        showToast(getLocale() === 'ar' ? 'أُضيف الطقم إلى السلة' : 'Ensemble ajouté au panier');
        btn.textContent = getLocale() === 'ar' ? 'أُضيف ✓' : 'Ajouté ✓';
        setTimeout(() => { btn.textContent = t('ensemble.addToCart'); }, 1200);
      });
    });
    const recent = getRecentProducts(4);
    document.getElementById('recent-grid').innerHTML = recent.map(renderProductCard).join('');
    document.getElementById('recent-section').hidden = recent.length === 0;
    wireWishlistButtons();

    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addToCart(btn.dataset.add, 1);
        btn.textContent = getLocale() === 'ar' ? 'أُضيف ✓' : 'Ajouté ✓';
        setTimeout(() => { btn.textContent = t('product.addToCart'); }, 1200);
      });
    });

    const reviews = getLocale() === 'ar'
      ? ['جودة رائعة وتغليف أنيق، وصل الطلب بسرعة!', 'خاتم جميل جدًا يستحق الثمن.', 'تعامل راقٍ وتوصيل سريع لمدينتي.']
      : ["Qualité superbe et emballage élégant, livraison rapide !", "Une très belle bague, ça valait le prix.", "Service impeccable et livraison rapide dans ma ville."];
    document.getElementById('review1').textContent = `"${reviews[0]}"`;
    document.getElementById('review2').textContent = `"${reviews[1]}"`;
    document.getElementById('review3').textContent = `"${reviews[2]}"`;
    wireReviewCarousel();
  }

  function wireReviewCarousel() {
    const track = document.querySelector('.reviews-grid');
    const cards = [...document.querySelectorAll('.reviews-grid .review-card')];
    const dots = [...document.querySelectorAll('.reviews-dots button')];
    if (!track || !cards.length || !dots.length || track.dataset.wired === '1') return;
    track.dataset.wired = '1';
    const update = () => {
      const left = track.scrollLeft;
      const dir = getComputedStyle(track).direction;
      const normalized = dir === 'rtl' ? Math.abs(left) : left;
      let index = 0;
      let best = Infinity;
      cards.forEach((card, i) => {
        const distance = Math.abs(card.offsetLeft - normalized - track.offsetLeft);
        if (distance < best) { best = distance; index = i; }
      });
      dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    };
    track.addEventListener('scroll', () => requestAnimationFrame(update), { passive: true });
    dots.forEach((dot, i) => dot.addEventListener('click', () => cards[i]?.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' })));
    update();
  }


  FLM_DATA_READY.then(() => {
    applyLocale();
    initHome();
    wireHeroSlider();
    if (window.FLM_SETTINGS_READY) {
      window.FLM_SETTINGS_READY.then(applyHeroSettings);
    }
    document.querySelectorAll('.lang-switch button').forEach((btn) => {
      btn.addEventListener('click', () => setTimeout(initHome, 0));
    });
  });
</script>
